language_conditions:
  - native_bangla
  - translated_bangla
  - code_mixed
  - banglish
  - english

evidence_conditions:
  - correct
  - partially_relevant
  - irrelevant
  - contradictory
  - missing

# Both generators see each scenario. Retrieval is deterministically assigned
# 50/50 per scenario and shared by the paired generator outputs.
generator_models:
  - qwen3:8b
  - gemma3:4b
model_artifacts:
  qwen3:8b:
    ollama_id: 500a1f067a9f
    weights_sha256: a3de86cd1c132c822487ededd47a324c50491393e6565cd14bafa40d0b8e686f
    parameters: 8.2B
    quantization: Q4_K_M
