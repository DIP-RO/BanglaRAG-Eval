    weights_sha256: f06e91e18fc74295d0c781bf91622508c75655e2c18ed869d52447ffe1e667e1
    projector_sha256: 7a50f9607a47389c028f2598c1f2d3e23b61913b4ce3c4a9eaaca62de1b9e098
    parameters: 3.9B
    quantization: Q4_K_M
    license: Gemma-Terms-of-Use
retrieval_methods:
  - bm25
  - semfuse
retrieval_top_k: 5

semfuse:
  package_version: 0.10.0
  mode: hybrid
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  embedding_model_revision: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
