dataset_version: pilot-methodology-2.0.0
example_id_prefix: pilot2
experimental_design: blocked_language
fixed_retrieval_per_question: true
target_records: 50
base_examples: 10
random_seed: 20261011

source:
  name: BanglaQuAD-v1.0
  split: train
  repository: https://github.com/banglaAI/BanglaQuAD-v1.0
  file: BanglaQuADv1.0-train.json
  sha256: ec5226e58b465d43f7a7b51976856099b2cac4145a5936aa204603f8c1dae2e6
  license: MIT

question_preparation:
  file: data/intermediate/pilot_methodology_v2_questions.jsonl
  sha256: 4beb157baab6ab4246a49909d85f27dd3e05c190c03ae58b9b3bfb0d075ac09c
  selection: first_10_from_frozen_seeded_sample

# Each source question is assigned one language condition. All five evidence
# variants for that question share the same question and raw BM25 result.
language_conditions:
  - native_bangla
  - translated_bangla
  - code_mixed
  - banglish
  - english

evidence_conditions:
  - correct
  - partially_relevant
  - irrelevant
  - contradictory
  - missing

generator_models:
  - qwen3:8b

retrieval_methods:
  - bm25
retrieval_top_k: 5

# Plausible same-type false values proposed for human review. These are not
# accepted automatically; the review packet still requires explicit approval.
contradiction_replacements:
  00c4f3ad-9ce6-4d5e-b1a3-ce1d5882fd47: "সেরট্রালিন ও সিটালোপ্রাম"
  00c9eb26-4237-416c-a630-b11fbff99e73: "ওমর খৈয়াম"
  03b6b061-caab-4a7c-b99f-efd2c33e89b6: "রেক্টিফায়ার"
  03fd9be5-6b78-40f2-9651-3be24bf74adf: "নিউক্লিওটাইড"
  08242f4f-8691-444e-accc-4e5091fbec70: "বহির্ভাগে"
  0901889c-4cc5-46f9-b938-de1a9f51eb82: "তিনটি"
  09438c83-aff8-4975-b5e8-a590cef8c1cd: "দ্বি-স্ট্র্যান্ড পলিমার"

generation:
  temperature: 0.0
  max_tokens: 256
  prompt_version: rag_campaign_concise_v2

review_gate:
  required: true
  file: data/intermediate/pilot_methodology_v2_review.jsonl

protocol_deviation:
  approved_by: null
  date: 2026-10-12
  description: >
    Methodology repair pilot. Generation is blocked until a human reviewer
    approves question meaning, answer leakage, semantic evidence support,
    contradiction type/grammar, and partial-evidence non-inferability.
