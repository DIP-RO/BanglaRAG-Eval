# Audited corrections for source-specific MT failures. Each entry must retain
# the original question's meaning and must not reveal the intended answer.
overrides:
  00c4f3ad-9ce6-4d5e-b1a3-ce1d5882fd47:
    english: "Which medicines does the FDA advise children and adolescents with depression not to use?"
    translated_bangla: "বিষণ্নতায় আক্রান্ত শিশু ও কিশোর-কিশোরীদের কোন ওষুধ ব্যবহার না করার পরামর্শ এফডিএ দেয়?"
    banglish: "FDA bishonnotay bhoga shishu o kishorder kon kon oshudh byabohar korte nishedh kore?"
  010dcb2d-9b51-482c-8eb8-47e841bcbe0f:
    english: "When did UCB Bank's subsidiary Upay begin its journey?"
    translated_bangla: "ইউসিবি ব্যাংকের সহযোগী প্রতিষ্ঠান উপায় কবে যাত্রা শুরু করে?"
  08242f4f-8691-444e-accc-4e5091fbec70:
    english: "In the set-builder method, where are the similarities among elements expressed?"
    translated_bangla: "সেট গঠন পদ্ধতিতে উপাদানগুলোর মিল বন্ধনীর কোথায় প্রকাশ করা হয়?"
  0901889c-4cc5-46f9-b938-de1a9f51eb82:
    english: "How many treatment approaches for mental disorders were available in the first half of the twentieth century?"
    translated_bangla: "বিংশ শতাব্দীর প্রথমার্ধে মনোরোগের চিকিৎসার জন্য মোটামুটি কতটি পদ্ধতি ছিল?"
  0a4d562f-c5bc-4588-89b6-ee79632ae07f:
    english: "What kind of line represents the two electrons that form a bonding pair?"
    translated_bangla: "বন্ধন জোড় গঠনকারী দুইটি ইলেকট্রনকে কী ধরনের রেখা দিয়ে দেখানো হয়?"
  0b5ed911-f2af-44ab-92f9-e3ed8b0bb3d3:
    english: "In which century did Geoffrey Chaucer write The Canterbury Tales?"
    translated_bangla: "জিওফ্রে চসার কোন শতাব্দীতে দ্য ক্যান্টারবেরি টেলস রচনা করেন?"
  0e6232d9-f514-4565-a487-89e565e32515:
    english: "Into how many broad categories can the simple concepts of geometry be divided?"
    translated_bangla: "জ্যামিতির সরল ধারণাগুলোকে মোটামুটি কয়টি বড় শ্রেণিতে ভাগ করা যায়?"
  0f65f77c-d8ad-447a-bb19-2977af2ad2cf:
    english: "What color are the posterior flank and upper abdomen of the male alkushum?"
    translated_bangla: "পুরুষ আলকুসুমের ক্ষদেশের পশ্চাৎভাগ ও উদরের উপরিভাগ কী রঙের?"
  1100d3fe-da0d-4155-8391-0cb2a256c602:
    english: "How does a wave's direction change when it enters another medium and its wavelength changes?"
    translated_bangla: "অন্য মাধ্যমে প্রবেশ করে তরঙ্গদৈর্ঘ্য বদলালে তরঙ্গের দিক কীভাবে পরিবর্তিত হয়?"
  1159a2c8-fa02-4929-84d2-bb13e91d9477:
    english: "What does the terminal end of an insect's dorsal tube carry as the aorta?"
    translated_bangla: "পতঙ্গের পৃষ্ঠীয় নলের প্রান্তীয় অংশটি মহাধমনী হিসেবে কী বহন করে?"
  11962f5e-14f9-4dce-8efe-9f94a5ee6322:
    english: "Who walked on the Moon in December 1972 as part of the Apollo 17 mission?"
    translated_bangla: "অ্যাপোলো ১৭ মিশনের অংশ হিসেবে ১৯৭২ সালের ডিসেম্বরে চাঁদে কে হেঁটেছিলেন?"
  1567c590-f3f1-4c10-b14b-d9e88075b28f:
    english: "For which type of itch is little detailed information available about central activation?"
    translated_bangla: "কোন ধরনের চুলকানির কেন্দ্রীয় সক্রিয়করণ সম্পর্কে খুব কম বিস্তারিত তথ্য রয়েছে?"
  1963975f-d0e0-450f-9a95-ec5518e6094a:
    english: "What significant developments have been established on both sides of the Athabasca River in Alberta?"
    translated_bangla: "আলবার্টায় আথাবাস্কা নদীর দুই পাশে কোন উল্লেখযোগ্য স্থাপনাগুলো গড়ে উঠেছে?"
  1997d8f7-fc42-42a4-9e45-7f0f28e8ebb3:
    english: "Which class of antibodies is found in saliva and breast milk?"
    translated_bangla: "লালা ও মায়ের বুকের দুধে কোন শ্রেণির অ্যান্টিবডি পাওয়া যায়?"
  19be13e2-ecec-4be0-ba4e-7736e4ad7b21:
    english: "Which enzyme is deficient in every animal that develops scurvy?"
    translated_bangla: "স্কার্ভি হয় এমন প্রত্যেক প্রাণীর কোন এনজাইমের অভাব থাকে?"
  1a0be45c-0c5c-416a-84e5-73b24b877080:
    english: "What are the ferries or small vessels that carry passengers on Venice's waterways called?"
    translated_bangla: "ভেনিসের জলপথে যাত্রী বহনকারী ফেরি বা ছোট জাহাজগুলোকে কী বলা হয়?"
  1b7258b5-4d5b-47a9-84e5-9b9f8df8f65d:
    english: "What is the process called when vibrations are confined to one direction or plane?"
    translated_bangla: "কম্পন একটি নির্দিষ্ট দিক বা তলে সীমাবদ্ধ থাকলে সেই প্রক্রিয়াকে কী বলে?"
  1bc638ae-98de-4e53-987c-b0de57d7f794:
    english: "Because it is what type of animal does the fox survive by hunting small animals?"
    translated_bangla: "কোন ধরনের প্রাণী হওয়ায় খেঁকশিয়াল ছোট প্রাণী শিকার করে বেঁচে থাকে?"
  1c6ea36f-006c-4c00-947f-85395cbb33dc:
    english: "Where can collisions between two high-energy particles be observed?"
    translated_bangla: "উচ্চশক্তির দুইটি কণার মুখোমুখি সংঘর্ষ কোথায় পর্যবেক্ষণ করা সম্ভব?"
  1ddc0210-7d44-4283-8369-7cd7e97aa6de:
    english: "Who is credited with the justified true belief theory of knowledge?"
    translated_bangla: "জ্ঞানের ন্যায্য সত্য বিশ্বাস তত্ত্বের কৃতিত্ব কাকে দেওয়া হয়?"
  1ee1a408-11e0-47d3-b779-07845f58ab3a:
    english: "How was a better understanding of the effects of protein phosphorylation achieved?"
    translated_bangla: "প্রোটিন ফসফরিলেশনের প্রভাব সম্পর্কে আরও ভালো ধারণা কীভাবে অর্জিত হয়েছে?"
  1f38db68-8893-40f2-bfab-905420574428:
    english: "According to electromagnetism, what operation is performed over a surface to obtain flux?"
    translated_bangla: "তড়িৎচুম্বকত্বের সংজ্ঞা অনুযায়ী ফ্লাক্স পেতে একটি পৃষ্ঠের উপর কোন গাণিতিক প্রক্রিয়া করা হয়?"
  24c5b397-48a6-4412-a55e-e85dd10c9fe3:
    english: "Into what kind of functions are rational attitudes, thoughts, and feelings divided?"
    translated_bangla: "যুক্তিসংগত মনোভাব, চিন্তা ও অনুভূতিকে কোন ধরনের কার্যাবলিতে ভাগ করা হয়?"
  2747ba63-3200-42ca-aae5-f3f4ef8caf28:
    english: "A change in what, caused by random sampling, is called genetic drift?"
    translated_bangla: "এলোমেলো নমুনা সংগ্রহের ফলে কিসের পরিবর্তনকে জেনেটিক ড্রিফট বলা হয়?"
  2aeebabf-a6c2-4d16-a361-c1977cd71e1e:
    english: "What property of a gas can be calculated from the mass of a known amount of a sample?"
    translated_bangla: "নমুনার জ্ঞাত পরিমাণের ভর থেকে গ্যাসের কোন বৈশিষ্ট্য গণনা করা যায়?"
  2caceafa-f362-4a93-9c9b-15b826deb07b:
    english: "Etymologically, feudalism is derived from a word in which language?"
    translated_bangla: "শব্দের উৎপত্তি অনুসারে সামন্ততন্ত্র কোন ভাষার শব্দ থেকে এসেছে?"
  2dff740a-1450-4231-862d-cb82e416fa9a:
    english: "In what year did Remington Arms introduce its self-loading repeating rifle?"
    translated_bangla: "রেমিংটন আর্মস কত সালে স্বয়ংক্রিয়ভাবে লোড হওয়া রিপিটিং রাইফেল চালু করে?"
  2f9cafdc-577b-43fd-83a4-cbbceb656922:
    english: "What is the zygote formed by the fusion of haploid male and female gametes?"
    translated_bangla: "হ্যাপ্লয়েড পুং ও স্ত্রী জননকোষের মিলনে গঠিত জাইগোটটি কী?"
  38f4be02-1411-40a7-a00f-9c32cd19fe02:
    english: "What does a novel become by maintaining harmony between its subject matter and language?"
    translated_bangla: "বিষয়বস্তু ও ভাষার সামঞ্জস্য বজায় রাখলে উপন্যাসটি কেমন হয়ে ওঠে?"
  39ea6827-9de1-4042-a6bd-ada7e00ecf9c:
    english: "In what year did Ernest Rutherford prove the existence of the proton?"
    translated_bangla: "আর্নেস্ট রাদারফোর্ড কত সালে প্রোটনের অস্তিত্ব প্রমাণ করেন?"
  3b3d4cec-02b3-430b-9ed8-c0187eeadf6b:
    english: "By what means do architectural engineers in Greece gain full recognition as architects?"
    translated_bangla: "গ্রিসের স্থাপত্য প্রকৌশলীরা কীভাবে পূর্ণাঙ্গ স্থপতি হিসেবে স্বীকৃতি পান?"
  3fb348c1-3a74-4c10-8115-a3629e1d64a6:
    english: "Theories concerning what dominated seventeenth- and eighteenth-century thought?"
    translated_bangla: "সপ্তদশ ও অষ্টাদশ শতাব্দীর চিন্তায় কোন বিষয়ের বিভিন্ন তত্ত্ব প্রাধান্য পেয়েছিল?"
  413b3af7-3e13-452f-ab99-9741f2da6582:
    english: "Until what year did the Parthenon remain intact?"
    translated_bangla: "পার্থেনন মন্দিরটি কত সাল পর্যন্ত অক্ষত অবস্থায় দাঁড়িয়ে ছিল?"
  466192c0-eead-415a-91a9-071a08c31b3b:
    english: "Which theories are applied in research on database and information-retrieval systems?"
    translated_bangla: "ডাটাবেস ও তথ্য পুনরুদ্ধার ব্যবস্থা নিয়ে গবেষণায় কোন কোন তত্ত্ব প্রয়োগ করা হয়?"
  47222b24-8cda-4c07-99c5-ce504a770b30:
    english: "What is a lyricist called when they both write lyrics and compose the music?"
    translated_bangla: "একজন গীতিকার গান লেখা ও সুর করা দুই কাজই করলে তাকে কী বলা হয়?"
  4772a8f4-0cf2-420e-95d6-2c16e232040a:
    english: "As of what year had speeds of only Mach 25 or more been achieved below the thermosphere?"
    translated_bangla: "কোন সালের হিসাব অনুযায়ী তাপমণ্ডলের নিচে কেবল মাখ ২৫ বা তার বেশি গতি অর্জিত হয়েছিল?"
  49710540-ecb6-4f50-8a15-439b6205b94e:
    english: "From classical times through the sixteenth century, which field underwent very little development?"
    translated_bangla: "শাস্ত্রীয় যুগ থেকে ষোড়শ শতাব্দী পর্যন্ত কোন শাস্ত্রের খুব কম বিকাশ ঘটেছিল?"
  4c51ebc3-ee5e-4a72-b307-762a4278538e:
    english: "The arrangement of what varies according to a bird's order, family, and species?"
    translated_bangla: "পাখির বর্গ, গোত্র ও প্রজাতি অনুযায়ী কিসের বিন্যাস ভিন্ন হয়?"
  4c809511-2c38-4e9f-9d3d-e29f447d08a4:
    english: "What is a fast-moving stream of water called when it crosses land?"
    translated_bangla: "দ্রুত প্রবাহিত জলস্রোত স্থলভাগ অতিক্রম করলে তাকে কী বলা হয়?"
  52bead00-59da-4fd5-b607-02b1ff506b2e:
    english: "After music is composed, what arrangement is made for it through customers or the media?"
    translated_bangla: "সঙ্গীত রচনার পর গ্রাহক বা প্রচারমাধ্যমের মাধ্যমে সেটি কী করার ব্যবস্থা করা হয়?"
  547837e7-28bd-40dc-be76-a04c4177e83f:
    english: "From what specific part do most birds' feathers begin to molt?"
    translated_bangla: "অধিকাংশ পাখির পালক কোন নির্দিষ্ট অংশ থেকে ঝরতে শুরু করে?"
  56ff90f2-5fdf-48a4-b10e-a8817df40721:
    english: "Between what sizes in nanometers do typical nanosystems range?"
    translated_bangla: "সাধারণ ন্যানোব্যবস্থার আকার কত থেকে কত ন্যানোমিটারের মধ্যে থাকে?"
  58756881-d2f3-4be4-ae47-81157f069ae4:
    english: "What type of devices are keyboards, mice, disks, scanners, card readers, and digital cameras?"
    translated_bangla: "কীবোর্ড, মাউস, ডিস্ক, স্ক্যানার, কার্ড রিডার ও ডিজিটাল ক্যামেরা কোন ধরনের যন্ত্র?"
  5a2ff88c-99ed-4a6d-a8a2-eabc1bf6654b:
    english: "On what basis are all quantities divided into vector and scalar quantities?"
    translated_bangla: "কোন ভিত্তিতে সব রাশিকে ভেক্টর ও স্কেলার রাশিতে ভাগ করা হয়?"
  5b92755d-8ffb-41cc-a9da-3f554811b819:
    english: "What kind of artificial phallus did actors playing male characters wear in ancient Greek comedy?"
    translated_bangla: "প্রাচীন গ্রিক কমেডিতে পুরুষ চরিত্রের অভিনেতারা কী ধরনের নকল পুরুষাঙ্গ পরতেন?"
  5f9467dd-1c56-48da-bb4d-9bbf8c38927a:
    english: "Algebra can essentially be regarded as what, but with computations involving variables?"
    translated_bangla: "চলরাশি নিয়ে গণনা করা ছাড়া বীজগণিতকে মূলত কিসের মতো বিবেচনা করা যায়?"
  6295abd5-e194-432b-8764-79bb5247a5d7:
    english: "How many days did the Beagle remain at Praia harbor in the Cape Verde Islands?"
    translated_bangla: "কেপ ভার্দে দ্বীপপুঞ্জের প্রাইয়া বন্দরে বিগল কত দিন অবস্থান করেছিল?"
  62a6042d-f5d8-41b8-9d10-8ed36776d0c4:
    english: "What kind of sperm is found year-round in the testes of male lizards?"
    translated_bangla: "পুরুষ টিকটিকির শুক্রাশয়ে সারা বছর কী ধরনের শুক্রাণু পাওয়া যায়?"
  6bfa88b4-056f-4c63-aa9a-8fe361fcd87d:
    english: "Weather forecasting efforts were once based mainly on what kind of pressure?"
    translated_bangla: "একসময় আবহাওয়ার পূর্বাভাস দেওয়ার প্রচেষ্টা প্রধানত কোন ধরনের চাপের উপর ভিত্তি করত?"
  6f3a86d4-5fb3-4822-9ccf-51da6c498dbb:
    english: "Rabbit and hare are common names for animals belonging to which mammalian family?"
    translated_bangla: "খরগোশ ও শশক কোন স্তন্যপায়ী গোত্রের প্রাণীদের সাধারণ নাম?"
  71fc72e5-0365-4f4d-b05c-2fbc296fc301:
    english: "What do spiny lobsters, squat lobsters, and slipper lobsters lack?"
    translated_bangla: "স্পাইনি লবস্টার, স্কোয়াট লবস্টার ও স্লিপার লবস্টারের কোন অঙ্গ নেই?"
  746bdfc2-9f5e-4ea3-a41b-0eee1c043e20:
    english: "What is it called when the truth is exaggerated or extended to a certain degree?"
    translated_bangla: "সত্যকে অতিরঞ্জন করা বা একটি নির্দিষ্ট মাত্রা পর্যন্ত প্রসারিত করাকে কী বলা হয়?"
  77b4b81d-10b6-4330-9409-366418366bdb:
    english: "What can the relatively complex eyes of higher animals distinguish?"
    translated_bangla: "উন্নত প্রাণীদের তুলনামূলক জটিল চোখ কী পৃথক করতে পারে?"
  793f5c88-bf40-4beb-8980-30c461b7e996:
    english: "At which university did Hans Christian Joachim Gram pass the matriculation examination?"
    translated_bangla: "হান্স ক্রিশ্চিয়ান জোয়াকিম গ্রাম কোন বিশ্ববিদ্যালয় থেকে ম্যাট্রিকুলেশন পরীক্ষায় উত্তীর্ণ হন?"
  80205cfa-3e0d-4ae9-b26c-a052e1600784:
    english: "In what year did Gobind Khorana receive the Nobel Prize for synthesizing an artificial gene?"
    translated_bangla: "গোবিন্দ খোরানা কৃত্রিম জিন সংশ্লেষণের জন্য কত সালে নোবেল পুরস্কার পান?"
  82acb21d-7570-4dca-9217-86a87ceca3b7:
    english: "According to Inca belief, Isla del Sol was the birthplace of which Inca?"
    translated_bangla: "ইনকা বিশ্বাস অনুযায়ী ইসলা দেল সোল কোন ইনকার জন্মস্থান ছিল?"
  837d3b78-5637-46dc-93b2-d17a2bab3750:
    english: "In what year BC did the ancient Egyptians create the earliest calendar?"
    translated_bangla: "প্রাচীন মিশরীয়রা খ্রিস্টপূর্ব কত সালে প্রাচীনতম পঞ্জিকা তৈরি করেছিল?"
  875698db-b1df-41fe-a9af-48fe4eff2dcf:
    english: "In which parts of the periwinkle plant are many valuable chemical compounds found?"
    translated_bangla: "নয়নতারা গাছের কোন কোন অংশে বহু মূল্যবান রাসায়নিক উপাদান পাওয়া যায়?"
  8826999e-6366-40c7-9130-5f3c54df5f91:
    english: "What must both parents carry for their child to have a chance of being albino?"
    translated_bangla: "সন্তানের অ্যালবিনো হওয়ার সম্ভাবনা থাকতে বাবা-মা উভয়ের কোন বৈশিষ্ট্যটি থাকতে হয়?"
  88910d87-64ae-40a8-aeac-0dc248b6cca2:
    english: "Approximately how many years ago did early humans migrate out of Africa to the rest of the world?"
    translated_bangla: "আনুমানিক কত বছর আগে প্রাথমিক মানুষ আফ্রিকা থেকে বিশ্বের অন্যান্য অঞ্চলে স্থানান্তরিত হয়েছিল?"
  8e06efdb-d658-479a-bf5a-d26880110b5e:
    english: "Fossils of which genus of tiger prawn were discovered in Oklahoma in 2010?"
    translated_bangla: "২০১০ সালে ওকলাহোমায় কোন গোত্রের বাগদা চিংড়ির জীবাশ্ম আবিষ্কৃত হয়?"
  97e6b6f8-6a06-4225-b639-4e9d9858e258:
    english: "What kind of general brain structure does the masculinizing effect produce in males?"
    translated_bangla: "পুরুষালীকরণ প্রভাব পুরুষের মস্তিষ্কে কী ধরনের সাধারণ কাঠামো তৈরি করে?"
  9f447778-defb-44c7-ad8c-4ba16622a1a1:
    english: "What percentage of the world's 5,300 reptile species has become endangered?"
    translated_bangla: "বিশ্বের ৫,৩০০ সরীসৃপ প্রজাতির কত শতাংশ বিপন্ন হয়ে পড়েছে?"
  a1835649-b9ca-41d3-a263-0fb41d84ddc6:
    english: "What are the major structural changes during the larval stage called?"
    translated_bangla: "লার্ভা অবস্থায় গঠনের প্রধান পরিবর্তনগুলোকে কী বলা হয়?"
  a66b8e92-bb81-4323-8687-f27f2a604dc4:
    english: "How many centimeters long was the skin of a black tiger recovered from smugglers?"
    translated_bangla: "চোরাকারবারিদের কাছ থেকে উদ্ধার করা কালো বাঘের চামড়াটি কত সেন্টিমিটার লম্বা ছিল?"
  a7353943-be40-4b9e-8b61-7be1ed5ce013:
    english: "During which numbered flight was F-117 Air Force serial number 79-0785 destroyed?"
    translated_bangla: "এফ-১১৭ এয়ার ফোর্স সিরিয়াল নম্বর ৭৯-০৭৮৫ কততম উড্ডয়নে ধ্বংস হয়েছিল?"
  abe80429-4aee-44f4-9404-91ba248faff7:
    english: "What new hurricane name replaced Katrina in 2011?"
    translated_bangla: "২০১১ সালে ক্যাটরিনার বদলে নতুন হারিকেনের নাম কী রাখা হয়?"
  ac18381e-904e-4e1f-89f7-7b54187f8b56:
    english: "Which tools do farmers following traditional cultivation methods use?"
    translated_bangla: "ঐতিহ্যবাহী চাষপদ্ধতি অনুসরণকারী কৃষকেরা কোন কোন সরঞ্জাম ব্যবহার করেন?"
  adf0034f-2d30-4189-93d9-a5975863f857:
    english: "Etymologically, which word derives from the English word 'architect'?"
    translated_bangla: "ব্যুৎপত্তিগতভাবে কোন শব্দটি ইংরেজি 'আর্কিটেক্ট' শব্দ থেকে এসেছে?"
  aea6dbe7-07a1-4b29-bab7-d1d8be54fcef:
    english: "What is the dissection of a body to determine the cause of an unusual or sudden death called?"
    translated_bangla: "অস্বাভাবিক বা আকস্মিক মৃত্যুর কারণ নির্ণয়ে মৃতদেহ ব্যবচ্ছেদ করাকে কী বলা হয়?"
  b77c9d6d-856c-461c-9a91-72d5caac6430:
    english: "What is it called when a biologically male child behaves in a conventionally masculine way?"
    translated_bangla: "জৈবিকভাবে ছেলে শিশু ছেলেদের মতো আচরণ করলে তাকে কী বলা হয়?"
  b927a8b3-1435-4513-9dd8-6e7804ed716a:
    english: "How does nonmetallic character change from left to right across a period in the periodic table?"
    translated_bangla: "পর্যায় সারণির একটি পর্যায়ে বাম থেকে ডানে গেলে অধাতব ধর্ম কীভাবে বদলায়?"
  bb9a64e9-bba5-4c90-b328-f6733f2b6b6e:
    english: "Toward the end of which century did sociologists propose that two types of nation exist?"
    translated_bangla: "কোন শতাব্দীর শেষ দিকে সমাজবিজ্ঞানীরা দুই ধরনের জাতির অস্তিত্বের কথা বলেন?"
  bc2eb18d-c0d8-4bf0-9372-b1fca054d8fb:
    english: "Scientifically, Bostami's turtle is described as what kind of softshell turtle?"
    translated_bangla: "বৈজ্ঞানিকভাবে বোস্তামীর কাছিমকে কী ধরনের নরম খোলের কচ্ছপ বলা হয়?"
  c60a9d3e-c07e-4995-8c49-4cee771d6c1f:
    english: "Expressed DNA can be obtained by isolating what molecule?"
    translated_bangla: "কোন অণুকে পৃথক করার মাধ্যমে প্রকাশিত ডিএনএ পাওয়া সম্ভব?"
  cd7af890-2c20-4ac1-bb06-36e7d30786b1:
    english: "The small round seeds of pointed gourd naturally help reduce the levels of what?"
    translated_bangla: "পটলের ছোট গোলাকার বীজ স্বাভাবিকভাবে কিসের মাত্রা কমাতে সাহায্য করে?"
  db585ce6-e299-4974-8577-87bc630dde83:
    english: "Norwich was designated as which numbered UNESCO City of Literature in England?"
    translated_bangla: "নরউইচ ইংল্যান্ডের কততম ইউনেস্কো সাহিত্য নগরী হিসেবে মনোনীত হয়?"
  dd37756b-732b-439c-973c-46be3aee4891:
    english: "Bacterial cell walls contain enzymes that break down which layer?"
    translated_bangla: "ব্যাকটেরিয়ার কোষপ্রাচীরের এনজাইমগুলো কোন স্তর ভেঙে দেয়?"
  e189865c-7145-430d-bde5-099b013ce81b:
    english: "How does a mass move inside a watch when the watch is set in motion?"
    translated_bangla: "হাতঘড়ি গতিশীল হলে এর ভেতরের একটি ভর কীভাবে নড়াচড়া করে?"
  e68f8f67-3a59-4b1b-88db-4c6257bd4d9d:
    english: "According to general relativity, what sign can the cosmological constant have?"
    translated_bangla: "সাধারণ আপেক্ষিকতা অনুযায়ী মহাজাগতিক ধ্রুবকের মানের চিহ্ন কী হতে পারে?"
  e8c1d1e1-760d-49f5-916f-cb5ef37dbd1c:
    english: "Before what year had Newton begun studying religious prophecy?"
    translated_bangla: "কোন সালের আগেই নিউটন ধর্মীয় ভবিষ্যদ্বাণী নিয়ে পড়াশোনা শুরু করেছিলেন?"
  f6454e99-ac48-4ad0-92d8-77711c7ae6b3:
    english: "When a signal travels along the network backbone, which computer receives it?"
    translated_bangla: "নেটওয়ার্ক ব্যাকবোন দিয়ে সংকেত চলার সময় কোন কম্পিউটার সেটি গ্রহণ করে?"
  f757c6c3-4f32-411d-b754-e3ea6dd6877c:
    english: "What is the abbreviation for the Accreditation Board for Engineering and Technology?"
    translated_bangla: "Accreditation Board for Engineering and Technology-এর সংক্ষিপ্ত রূপ কী?"
  fc178d35-9f77-47fc-a4d8-350559c9cbf3:
    english: "An Abelian, or commutative, group is a group whose group operation has what property?"
    translated_bangla: "অ্যাবেলিয়ান বা বিনিময়ী দলের দলীয় ক্রিয়ার কোন বৈশিষ্ট্য থাকে?"
  fd644bc6-f70e-4417-92a6-e6bf9c9510ae:
    english: "What hard protective covering is present on the skin of reptiles and fish?"
    translated_bangla: "সরীসৃপ ও মাছের ত্বকে সুরক্ষার জন্য কোন শক্ত আবরণ থাকে?"
